<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrendZone | Fashion Store</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header class="site-header">
      <a class="brand" href="#" id="homeLink" aria-label="TrendZone home">TrendZone</a>
      <nav class="main-nav" aria-label="Primary navigation">
        <a href="#" class="nav-link is-active" data-view="home">Home</a>
        <a href="#" class="nav-link" data-view="new">New In</a>
        <a href="#" class="nav-link" data-view="women">Women</a>
        <a href="#" class="nav-link" data-view="men">Men</a>
        <a href="#" class="nav-link" data-view="sale">Sale</a>
      </nav>
      <button class="cart-button" id="cartButton" type="button" aria-label="View cart">
        <span class="cart-icon" aria-hidden="true">Bag</span>
        <span id="cartCount">0</span>
      </button>
    </header>

    <main>
        <section class="storefront" id="storefront" aria-labelledby="storefrontTitle">
        <div class="storefront-heading">
          <div>
            <p class="eyebrow" id="storefrontEyebrow">Fresh Picks</p>
            <h1 id="storefrontTitle">Shop TrendZone</h1>
          </div>
          <p id="storefrontCopy">
            Curated layers, soft essentials, and polished everyday pieces for a
            cleaner wardrobe rotation across India.
          </p>
        </div>

        <div class="product-grid" id="productGrid" aria-label="Product list"></div>
      </section>

      <section
        class="product-page is-hidden"
        id="productDetail"
        aria-labelledby="productTitle">
        <button class="back-button" id="backButton" type="button">Back to products</button>

        <section class="gallery" aria-label="Product image gallery">
          <div class="image-stage">
            <img id="mainImage" src="" alt="" />
          </div>

          <div class="thumbnail-row" id="thumbnailRow" role="list"></div>
        </section>

        <section class="product-info">
          <p class="eyebrow" id="productCategory"></p>
          <h1 id="productTitle"></h1>
          <div class="price-row" id="productPrice"></div>
          <p class="description" id="productDescription"></p>

          <div class="product-meta" id="productMeta"></div>

          <fieldset class="size-picker">
            <legend>Available Sizes</legend>
            <div class="size-options">
              <label>
                <input type="radio" name="size" value="S" checked />
                <span>S</span>
              </label>
              <label>
                <input type="radio" name="size" value="M" />
                <span>M</span>
              </label>
              <label>
                <input type="radio" name="size" value="L" />
                <span>L</span>
              </label>
              <label>
                <input type="radio" name="size" value="XL" />
                <span>XL</span>
              </label>
            </div>
          </fieldset>

          <button id="addToCart" class="add-to-cart" type="button">
            Add to Cart
          </button>
          <p
            id="cartMessage"
            class="cart-message"
            role="status"
            aria-live="polite"
          ></p>
        </section>
      </section>

      <section class="cart-page is-hidden" id="cartPage" aria-labelledby="cartTitle">
        <div class="cart-heading">
          <div>
            <p class="eyebrow">Your Bag</p>
            <h1 id="cartTitle">Shopping Cart</h1>
          </div>
          <button class="back-button" id="continueShopping" type="button">
            Continue shopping
          </button>
        </div>

        <div class="cart-layout">
          <div class="cart-items" id="cartItems"></div>

          <aside class="cart-summary" aria-label="Order summary">
            <h2>Order Summary</h2>
            <div class="summary-line">
              <span>Subtotal</span>
              <strong id="subtotalAmount">Rs. 0</strong>
            </div>
            <div class="summary-line">
              <span>Delivery</span>
              <strong id="deliveryAmount">Rs. 0</strong>
            </div>
            <div class="summary-line total">
              <span>Total</span>
              <strong id="totalAmount">Rs. 0</strong>
            </div>

            <form class="checkout-form" id="checkoutForm">
              <label>
                Full name
                <input type="text" id="customerName" required placeholder="Your name" />
              </label>
              <label>
                Mobile number
                <input
                  type="tel"
                  id="customerPhone"
                  required
                  pattern="[0-9]{10}"
                  placeholder="10 digit mobile"
                />
              </label>
              <label>
                Delivery city
                <input type="text" id="customerCity" required placeholder="e.g. Delhi" />
              </label>
              <button class="add-to-cart" type="submit">Place Order</button>
            </form>
            <p id="orderMessage" class="cart-message" role="status" aria-live="polite"></p>
          </aside>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
